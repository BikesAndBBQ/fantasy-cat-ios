  - id: 7ea7d3
    title: "Milestone 4a: post a photo or video (pipeline and screen)"
    status: done
    owner: agent
    created_at: 2026-09-20
    done_at: 2026-09-20
    archived_at: 2026-09-28
    note: |
      PhotosPicker asking for the original file (`.current`, no H.264
      conversion), with progress and real errors; on-device trim and 1080p HEVC
      export of only the kept part; background-URLSession upload; submit via
      the generated client. Trim bar mirrors the web's. Verified in the
