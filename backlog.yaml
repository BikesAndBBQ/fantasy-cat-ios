  - title: "Install Xcode and point the command line at it"
    status: done
    owner: ryan
    created_at: 2026-09-20
    done_at: 2026-09-20
    note: |
      This Mac has only the Command Line Tools, so nothing iOS can be built.
      App Store -> Xcode (or `xcodes install --latest` if you use xcodes), open
      it once to accept the licence and let it install the iOS platform and a
      simulator, then:
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      Check with: xcodebuild -version

  - title: "Apple Developer Program membership, and the Team ID"
    status: blocked
    owner: ryan
    created_at: 2026-09-20
    note: |
      $99/year at developer.apple.com/programs (individual is fine). Needed for
      TestFlight, push, and associated domains (passkeys, invite links). A free
      Apple ID only gets a 7-day build on your own phone. Then sign in to
      Xcode (Settings -> Accounts) and tell the agent the 10-character Team ID
      (developer.apple.com/account -> Membership details). It isn't a secret.

