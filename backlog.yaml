  - title: "Milestone 4a: post a photo or video (pipeline and screen)"
    status: done
    owner: agent
    created_at: 2026-09-20
    done_at: 2026-09-20
    note: |
      PhotosPicker asking for the original file (`.current`, no H.264
      conversion), with progress and real errors; on-device trim and 1080p HEVC
      export of only the kept part; background-URLSession upload; submit via
      the generated client. Trim bar mirrors the web's. Verified in the
      Simulator against ./dev.sh with `-autopost`: a 40 s clip trimmed to 1-3 s
      arrived and the server made a 2000 ms video; a real iPhone HEIC posted.
      Both themes looked at. NOT verified, because the Simulator can't: the
      picker itself, an iCloud original downloading, a long 4K video, leaving
      the app mid-upload.

  - title: "Milestone 3: read the league (This week, Results, Standings)"
    status: done
    owner: agent
    created_at: 2026-09-20
    done_at: 2026-09-20
    note: |
      Native tab bar; league name and account avatar as a page header row (the
      navigation bar wrapped them in glass capsules and truncated the name).
      This week: live countdown, category chips with counts, two-column feed,
      submission sheet (video plays; take down your own post while open),
      floating Post. Results: round picker, winners with rosette and count,
      runners-up, "You earned". Standings: tied ranks from the server, your row
      highlighted. Pull to refresh; league refreshed every minute. Verified in
      the Simulator against ./dev.sh, both themes, and a post made through the
      new entry point refreshed the feed by itself.

  - title: "Milestone 5: vote in the app"
    status: done
    owner: agent
    created_at: 2026-09-20
    done_at: 2026-09-20
    note: |
      Vote tab (badge = categories where you still have treats to give),
      category progress strip, budget bar with pips, a stepper per post that
      disables itself at the budget or the per-post cap, a light haptic per
      change, saved 600 ms after the last tap and flushed when you leave the
      category; on a refusal it falls back to what the server has. "Nothing to
      vote on yet" counts down to when voting opens. Verified in the Simulator
      against ./dev.sh: votes cast through the app were stored (spent 3 of 5:
      Biscuit 2, Bean 1), came back after a cold relaunch, and the server
      refuses an over-budget ballot with 422. Haptics can't be felt in a
      Simulator.

