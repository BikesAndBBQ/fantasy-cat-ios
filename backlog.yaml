  - title: "Milestone 2a: generated API client and password sign-in"
    status: done
    owner: agent
    created_at: 2026-09-20
    done_at: 2026-09-20
    note: |
      Client generated from the server's openapi.json (`make api`), checked in;
      the app depends only on the two OpenAPI runtime packages. Bearer session
      in the Keychain. Verified in the Simulator against ./dev.sh: a wrong
      password shows the server's sentence; the right one lands on Home; a cold
      relaunch is still signed in (server saw GET /me 200); sign-out revokes the
      session (logout 204) and the next launch asks again. Found and fixed on
      the way: Go's fractional-second timestamps failed to decode.

