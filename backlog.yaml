  - id: 712f67
    title: "Headless signing: an App Store Connect API key in the FantasyCat vault"
    status: done
    owner: agent
    created_at: 2026-09-28
    done_at: 2026-09-28
    note: |
      ### Done 2026-09-28: Admin key works
      Ryan replaced the key with an **Admin** Team Key and revoked the
      Developer one. Verified: archive + export for App Store Connect
      succeeded from a dispatch. The `.ipa` is signed *Apple Distribution:
      Ryan OLSON (Y837X7M3W4)* with an App Store profile for
      `co.fantasycat.app` (TestFlight enabled, expires 2027-09-28). Not yet
      uploaded: that needs the app record (`8fd754`). Still open: the
      allow rule for `scripts/ios-xcodebuild.sh` in the server repo's
      `.claude/settings.json` (a dispatch can't write it).

      ### 2026-09-28, third pass: Developer role tested
      Key ID and Issuer ID are in the vault item. `scripts/ios-xcodebuild.sh`
      (server repo, decision I12) signs with the key.
      - **Works:** a signed Release device build. It registered the real
        app id `co.fantasycat.app`, and the team profile runs to 2027-09-28.
        So the "No Accounts" problem is solved for development builds.
      - **Fails:** exporting for App Store Connect, which TestFlight needs:
        "Cloud signing permission error", "No signing certificate iOS
        Distribution". A Developer key can't create the distribution
        certificate.
      - **Ryan's next step:** make a new Team Key with the **Admin** role,
        which I'm confident can do cloud distribution signing. App Manager
        may work if the key is given access to cloud-managed distribution
        certificates, but I haven't confirmed that. Replace the three fields
        in the same vault item, and revoke the Developer key if you like.
        Admin can technically submit for review; the agent never does (I8).
      - **Allow-list:** add `Bash(scripts/ios-xcodebuild.sh:*)` to the
        server repo's `.claude/settings.json`; a dispatch can't edit that
        file. Until then it runs through `python3`.

      **2026-09-28, second pass:** the vault item *App Store Connect API Key*
      exists, with the `.p8` private key in its `credential` field. **Still
      missing: the Key ID and the Issuer ID.** Signing needs all three, so
      nothing could be tested yet. Both are on App Store Connect -> Users and
      Access -> Integrations -> Team Keys: the Issuer ID above the list, the
      Key ID in the key's row. Add them to the same item as two text fields
      named `key id` and `issuer id`. Neither is secret, but they belong
      together.

      **Role:** the key has **Developer**. My understanding, not yet tested, is
      that this can build and sign for your devices but can't create the
      distribution certificate TestFlight needs; that takes **App Manager**
      (or Admin). The agent tests with the Developer key first and asks for
      a new App Manager key only if it fails.

      With the paid membership confirmed, a dispatch still can't sign. Probed
      2026-09-28: a Release device build with `-allowProvisioningUpdates`
      fails with **"No Accounts"** and "No profiles for `co.fantasycat.app`".
      `xcodebuild` in a dispatch doesn't see the Apple ID signed in to Xcode.
      This blocks the real bundle id, Associated Domains (`703a84`) and
      every TestFlight upload.

      **The durable fix:** an App Store Connect API key that `xcodebuild`
      uses directly (`-authenticationKeyPath/-ID/-IssuerID`).
      - App Store Connect -> Users and Access -> Integrations -> Team Keys,
        role **App Manager** (enough to register the app id, manage profiles
        and upload to TestFlight; it cannot submit for review).
      - Put it in the **FantasyCat** vault: the `.p8` contents, the Key ID
        and the Issuer ID. Never in either repo (hard line).
      - The agent then adds a script that loads it with the project token,
        writes the key to a temp file outside the repo for one build, and
        deletes it, and records the decision.

      **Quicker, but only for Ryan at the Mac:** open the project in Xcode,
      Settings -> Accounts, check the team no longer says "(Personal Team)",
      then build to your phone once from Xcode. That creates profiles by hand
      but doesn't let a dispatch sign.

  - id: 8fd754
    title: "Create the app record in App Store Connect"
    status: done
    owner: ryan
    created_at: 2026-09-28
    done_at: 2026-09-28
    note: |
      **Done 2026-09-28.** Ryan created it: *Fantasy Cat*, SKU `fantasycat-ios`,
      Apple id `6817008793` (confirmed through the API). The first build,
      `1.0 (202609281509)`, was uploaded with `make testflight` and processed
      as **VALID**, ready for internal testing.

      TestFlight needs an app record, and **the App Store Connect API can't
      create one**: that is web-only, whatever the key's role. The agent can
      register the bundle id `co.fantasycat.app` first (a signed build does
      it) so it appears in the form. Then, on appstoreconnect.apple.com:
      - Apps -> **+** -> New App, platform **iOS**
      - Name: *Fantasy Cat League* (or your pick; changeable before release)
      - Primary language English (U.S.), bundle ID `co.fantasycat.app`
      - SKU: anything unique, e.g. `fantasycat-ios`
      - User access: Full Access
      This does not submit anything for review. Waits on `712f67` so the
      bundle id exists; you can also register it yourself under
      developer.apple.com -> Identifiers.
      **2026-09-28: `co.fantasycat.app` is registered now**, so it is in the
      form's bundle ID list. Ready for you.

  - id: 97a07a
    title: "Forced update: a server switch that blocks old app builds"
    status: done
    owner: agent
    created_at: 2026-09-28
    done_at: 2026-09-28
    note: |
      Ryan asked for it before any launch, as a safety net (decision I13).
      - **Server:** `GET /api/app/ios` returns `min_build` from
        `IOS_MIN_BUILD` in `deploy/env.production` (0 = off). Deployed
        2026-09-28; production answers `min_build: 0`.
      - **App:** checks at launch and on every return to the foreground;
        below the minimum it shows only "Time to update" with a TestFlight
        button. Fails open when offline.
      - **To pull it:** set `IOS_MIN_BUILD` to the fixed build's number,
        commit, `scripts/deploy.sh`. Runbook: server README, "Forcing an
        iPhone app update".
      - **Verified in the Simulator** against `./dev.sh`: off, forced by the
        server value, cleared while the app was open, both themes. Not
        checked on a real phone, and the TestFlight button itself can't be
        tried in a Simulator.
      - First build with the check: `1.0 (202609282151)`. The earlier
        `202609281509` can't be blocked.
