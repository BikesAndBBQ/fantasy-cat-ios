name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Whether these copies match the server (the spec in Tools/openapi, Tokens.swift)
# is checked in the server repo's CI: that repo is private, this one can't read it.
jobs:
  ios:
    # The app is made with Xcode 27, which no hosted image carries yet (2026-10:
    # macos-26 tops out at 26.6, and there is no macos-27 label). So this takes
    # the newest Xcode the image has, and moves to 27 by itself when it lands.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Core tests
        run: swift test --package-path Core
      - name: Generated API client is current
        run: make api-gen && git diff --exit-code -- FantasyCat/API/Generated
      - name: Build for the Simulator
        run: make build DESTINATION='generic/platform=iOS Simulator' XCFLAGS=CODE_SIGNING_ALLOWED=NO
